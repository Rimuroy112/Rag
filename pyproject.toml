[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rimu Roy", email = "titashroy112@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-groq",
    "langchain-openai",
    "chromadb",
    "sentence-transformers",
    "faiss-cpu",
    "tiktoken",
    "pypdf",
    "python-dotenv",
    "ipykernel",
    "pandas",
    "numpy",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
